        <label class="option"><input type="radio" name="v"><span>Seulement dans la 1.1.0</span></label>`,
        actions: `<button class="btn" data-aller="fermer">Fermer… (ce n'est pas un bug)</button><span class="espace"></span><button class="btn vert" data-aller="traiter">✓ Valider le cadrage</button>` },
      contenu: `<div class="carte"><div class="bandeau bleu"><strong>Reproduit par l'outil</strong> : le test « victoire sur l'anti-diagonale » échoue sur la 1.0.0 et sur la 1.1.0.</div>
        <p><strong>Cause probable.</strong> regles_morpion ne vérifie qu'une des deux diagonales.</p>
        <p><strong>Résultat attendu.</strong> Trois symboles alignés sur l'une ou l'autre diagonale donnent la victoire.</p>
        <p class="petit-txt" style="margin-bottom:0"><strong>Critère :</strong> MRP-40 victoire sur les deux diagonales · <strong>Architecture :</strong> aucun changement prévu</p></div>
        ${etapes([["Reproduction", "le test échoue sur la 1.0.0"], ["Cadrage", "à valider"], ["Conception"], ["Développement"], ["Vérification"], ["Recette"], ["Livraison dans 1.0.1"], ["Report dans 1.1.0"]], "Cadrage")}`,
      conv: CONV("Conversation", [["moi", "Je gagne avec trois X sur la diagonale ↗ et la partie continue. (signalé dans la 1.0.0)"], ["agent", "Reproduit : un test le montre sur la 1.0.0 et la 1.1.0. La cause est dans regles_morpion, pas de changement d'architecture."]]),
    }),
  },
  "story-bug": {
    nom: "P5.3 Un correctif en cours", groupe: "P5. Signaler un bug",
    note: "Rien à décider : pas de bloc en haut. Un correctif n'est terminé qu'une fois reporté dans la version en développement.",
    rendu: () => objet("versions", [["Versions", "versions"], ["1.0.1", "versions"], "Rejouer reste actif pendant l'animation"], {
      actions: ACT_STORY,
      contenu: `<div class="maintenant"><span class="anim"></span><span>Vérification : suite complète sur la 1.0.1</span></div>${etapes(ETAPES_BUG, "Vérification")}`,
      conv: CONV("Conversation", [["evt", "Tâche 1 terminée et relue"], ["evt", "Vérification lancée par l'outil"]]),
    }),
  },
  ecart: {
    nom: "P8.1 Écart d'architecture", groupe: "P8. Architecture",
    note: "Sur la page de la story : l'écart et le choix en haut ; dessous, ce qui a été annoncé et ce qui est relevé, et les fichiers touchés pour juger ; à droite, l'agent explique.",
    rendu: () => objet("traiter", [["À traiter", "traiter"], "Écran de victoire"], {
      actions: ACT_STORY,
      decision: { titre: "Écart d'architecture : une dépendance non annoncée casse une règle", corps: `
        <label class="option"><input type="radio" name="e" checked><span>Demander la correction<span class="reco">recommandé</span><small>regles_morpion émet « victoire(ligne) » ; l'interface l'écoute. La story repart en développement.</small></span></label>
        <label class="option"><input type="radio" name="e"><span>Accepter l'exception<small>enregistrée comme décision, avec ta raison</small></span></label>`,
        actions: `<span class="espace"></span><button class="btn vert" data-aller="traiter">Valider</button>` },
      contenu: `<div class="carte"><table><tr><th>Annoncé à la conception</th><th>Relevé par l'outil sur la branche</th></tr>
          <tr><td>Nouveau composant gui/victoire</td><td class="ok">✓ gui/victoire</td></tr>
          <tr><td>gui/victoire → systems/regles_morpion</td><td class="ok">✓ présente</td></tr>
          <tr><td class="discret">(non annoncée)</td><td class="ko">✗ gui/victoire → actors/grille</td></tr></table>
        <p class="petit-txt" style="margin-bottom:0"><strong>Règle cassée :</strong> gui et actors ne dépendent pas l'un de l'autre (décision 001). La fusion est bloquée.</p></div>
        ${etapes([["Cadrage", "validé par toi"], ["Conception", "1 décision validée"], ["Développement", "3 tâches, relues"], ["Vérification", "règle d'architecture cassée : fusion bloquée"], ["Recette"], ["Livraison dans 1.1.0"]], "Vérification")}`,
      conv: CONV("Conversation", [["evt", "Vérification : 1 règle d'architecture cassée"], ["agent", "Pour surligner la ligne gagnante, le panneau lit la grille directement. Je ne l'avais pas annoncé. La correction propre : que regles_morpion émette la ligne gagnante."]]),
    }),
  },
  "story-menu": {
    nom: "P4.1 Le menu ⋯ d'une story en cours", groupe: "P4. Changer d'avis",
    note: "Le périmètre d'une story en cours ne change pas. Un nouveau besoin : une suite. Un besoin qui a changé : abandonner et recadrer. Rien ne se supprime.",
    rendu: () => objet("versions", [["Versions", "versions"], ["1.1.0", "versions"], "Animation des pions"], {
      actions: ACT_STORY, contenu: etapes(ETAPES_FEATURE, "Développement"),
      conv: CONV("Conversation", [["evt", "Tâche 1 terminée et relue"]]),
      flottant: `<div class="menu-objet">
        <div class="entree"><span>Renommer</span><span class="discret petit-txt">F2</span></div>
        <div class="entree off"><span>Modifier la demande<small>impossible une fois commencée</small></span></div>
        <div class="sep"></div>
        <div class="entree" data-aller="nouvelle"><span>Ajouter une suite…<small>nouvelle story liée, avec son cadrage</small></span></div>
        <div class="entree" data-aller="recadrer"><span>Abandonner et recadrer…<small>la demande corrigée repart au cadrage</small></span></div>
        <div class="sep"></div>
        <div class="entree"><span>Abandonner…</span></div></div>`,
    }),
  },
});

const ORDRE = [
  ["Les lieux", ["traiter", "traiter-vide", "backlog-version", "backlog-epic", "backlog-etat", "versions", "architecture", "vision"]],
  ["P1. Créer un projet", ["nouveau-projet", "vision-creation", "regles-creation", "projet-neuf"]],
  ["P2. Demander une feature", ["nouvelle", "discuter", "cadrage", "story-brouillon", "decision-archi", "story"]],
  ["P3. Recetter", ["recette"]],
  ["P4. Changer d'avis", ["story-menu", "recadrer", "fermer"]],
  ["P5. Signaler un bug", ["signaler", "cadrage-bug", "story-bug"]],
  ["P6–P7. Versions", ["livrer", "planifier"]],
  ["P8. Architecture", ["ecart", "adr"]],
  ["La barre", ["projets", "replie"]],
];

function afficher(id) {
  const e = ECRANS[id];
  const neuf = ["vision-creation", "regles-creation", "projet-neuf"].includes(id);
  document.getElementById("fenetre").innerHTML = `<div class="titre-fenetre"><span>Spawn Game Studio — ${neuf ? "Casse-briques" : "Morpion"}</span><span>— ☐ ✕</span></div>` + e.rendu();
  document.getElementById("note").innerHTML = `<strong>${e.nom}</strong> · ${e.note}`;
  document.querySelectorAll(".nav button").forEach((b) => b.classList.toggle("actif", b.dataset.aller === id));
  try { history.replaceState(null, "", "#" + id); } catch {}
}
document.getElementById("nav").innerHTML = `<h1>Maquette de l'app</h1><p>Tirée de docs/parcours.md et docs/modele.md. Ce panneau sert à naviguer, il ne fait pas partie de l'app. Tout est cliquable.</p>` +
  ORDRE.map(([t, ids]) => `<h2>${t}</h2>` + ids.map((i) => `<button data-aller="${i}">${ECRANS[i].nom}</button>`).join("")).join("");
document.addEventListener("click", (ev) => { const c = ev.target.closest("[data-aller]"); if (c && ECRANS[c.dataset.aller]) { ev.preventDefault(); afficher(c.dataset.aller); } });
afficher(ECRANS[location.hash.slice(1)] ? location.hash.slice(1) : "traiter");
</script>
